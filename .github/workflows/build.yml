name: Build

on:
  push:
    branches: [ 'claude/**', 'main', 'master' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kro-jar
          path: build/libs/*.jar

      # Temporary: print exact 1.21.11 signatures used by new features
      - name: API probe
        if: always()
        continue-on-error: true
        run: |
          set +e
          J=$(find ~/.gradle/caches/fabric-loom -name "minecraft-merged*.jar" 2>/dev/null | grep "loom.mappings" | grep -v -i sources | grep -v intermediary | head -1)
          echo "--- using $J"
          sig() { echo "=== SIG $1"; javap -p -cp "$J" "$1" 2>&1 | grep -E -- "${2:-.}" || true; }
          code() { echo "=== CODE $1 :: $2"; javap -p -c -cp "$J" "$1" 2>&1 | awk -v pat="$2(" 'index($0, pat) && !inm && $0 ~ /^  [a-z]/ {inm=1} inm {print} inm && /^$/ {inm=0}' || true; }
          sig net.minecraft.client.Minecraft "rightClickDelay|missTime| startAttack| startUseItem| continueAttack"
          code net.minecraft.client.Minecraft startAttack
          echo "=== Minecraft.tick timers"; javap -p -c -cp "$J" net.minecraft.client.Minecraft | awk '/^  public void tick\(\);/ {inm=1} inm {print} inm && /^$/ {exit}' | grep -n -E "rightClickDelay|missTime|handleKeybinds|startAttack|startUseItem|continueAttack" || true
          echo "=== Minecraft.handleKeybinds timers"; javap -p -c -cp "$J" net.minecraft.client.Minecraft | awk '/ handleKeybinds\(\);/ {inm=1} inm {print} inm && /^$/ {exit}' | grep -n -E "rightClickDelay|missTime|startAttack|startUseItem|continueAttack|isDown|consumeClick" || true
          echo "=== Minecraft.startUseItem timers"; javap -p -c -cp "$J" net.minecraft.client.Minecraft | awk '/ startUseItem\(\);/ {inm=1} inm {print} inm && /^$/ {exit}' | grep -n -E "rightClickDelay|bipush|iconst" | head -8 || true
          code net.minecraft.client.renderer.GameRenderer pick
          sig net.minecraft.world.entity.player.Player "InteractionRange|canInteractWith|AttackRange|attackRange"
          code net.minecraft.world.entity.player.Player entityInteractionRange
          sig net.minecraft.world.item.component.AttackRange
          echo "=== server attack check"; javap -p -c -cp "$J" net.minecraft.server.network.ServerGamePacketListenerImpl | awk '/ handleInteract\(/ {inm=1} inm {print} inm && /^$/ {exit}' | grep -E "invoke|ldc|dconst" | head -30 || true
