name: Build

on:
  push:
    branches: [ 'claude/**', 'main', 'master' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kro-jar
          path: build/libs/*.jar

      # Temporary: print exact 1.21.11 signatures used by new features
      - name: API probe
        if: always()
        continue-on-error: true
        run: |
          set +e
          J=$(find ~/.gradle/caches/fabric-loom -name "minecraft-merged*.jar" 2>/dev/null | grep "loom.mappings" | grep -v -i sources | grep -v intermediary | head -1)
          echo "--- using $J"
          sig() { echo "=== SIG $1"; javap -p -cp "$J" "$1" 2>&1 | grep -E -- "${2:-.}" || true; }
          code() { echo "=== CODE $1 :: $2"; javap -p -c -cp "$J" "$1" 2>&1 | awk -v pat="$2(" 'index($0, pat) && !inm && $0 ~ /^  [a-z]/ {inm=1} inm {print} inm && /^$/ {inm=0}' || true; }
          code net.minecraft.client.renderer.ScreenEffectRenderer renderItemActivationAnimation
          code net.minecraft.client.renderer.ScreenEffectRenderer displayItemActivation
          code net.minecraft.client.renderer.ItemInHandRenderer renderItem
          sig net.minecraft.client.renderer.entity.state.EntityRenderState
          sig net.minecraft.client.renderer.entity.state.AvatarRenderState "id|class"
          sig net.minecraft.client.renderer.SubmitNodeStorage\$FlameSubmit
          sig net.minecraft.client.multiplayer.MultiPlayerGameMode
          sig net.minecraft.world.entity.player.Inventory
          sig net.minecraft.world.inventory.InventoryMenu
          sig net.minecraft.world.inventory.ClickType
          sig net.minecraft.world.inventory.AbstractContainerMenu "containerId|getCarried|slots|getSlot|stateId"
          sig net.minecraft.world.inventory.Slot "index|container|getItem|getContainerSlot"
          sig net.minecraft.world.level.block.RespawnAnchorBlock
          code net.minecraft.world.level.block.RespawnAnchorBlock useItemOn
          code net.minecraft.world.level.block.RespawnAnchorBlock useWithoutItem
          code net.minecraft.world.level.block.RespawnAnchorBlock canSetSpawn
          sig net.minecraft.world.level.block.state.properties.BlockStateProperties "RESPAWN_ANCHOR"
          sig net.minecraft.world.item.EndCrystalItem
          code net.minecraft.world.item.EndCrystalItem useOn
          sig net.minecraft.world.entity.boss.enderdragon.EndCrystal "class|public"
          sig net.minecraft.client.Minecraft "startUseItem|startAttack|continueAttack|rightClickDelay|missTime|handleKeybinds| hitResult| gameMode| player;| level;| screen;|particleEngine|getConnection"
          code net.minecraft.client.Minecraft startAttack
          code net.minecraft.client.Minecraft startUseItem
          sig net.minecraft.world.InteractionResult
          sig 'net.minecraft.world.InteractionResult$Success'
          sig net.minecraft.world.InteractionHand
          sig net.minecraft.client.gui.screens.inventory.AbstractContainerScreen "hoveredSlot|menu;|getSlotUnderMouse|class"
          sig net.minecraft.client.gui.screens.inventory.InventoryScreen "class|InventoryScreen\("
          sig net.minecraft.world.entity.LivingEntity "hasEffect|getOffhandItem|getMainHandItem|getItemInHand|isUsingItem|getHealth\(|isDeadOrDying|hurtTime|deathTime"
          sig net.minecraft.world.entity.Entity "isOnFire|displayFireAnimation|getRemainingFireTicks|fireImmune|getBbHeight|getBbWidth| position\(|blockPosition|getEyePosition|getId\(|isRemoved|isAlive|distanceTo|getBoundingBox|isShiftKeyDown"
          sig net.minecraft.world.effect.MobEffects "FIRE_RESISTANCE"
          sig net.minecraft.core.particles.ParticleTypes "EXPLOSION|POOF|SMOKE;"
          sig net.minecraft.client.multiplayer.ClientLevel "addParticle|trackExplosionEffects|playLocalSound"
          sig net.minecraft.client.gui.GuiGraphics "renderItem|renderFakeItem|renderItemDecorations| pose\(|nextStratum"
          sig net.minecraft.world.level.Level "dimension\(|NETHER|OVERWORLD|getBlockState|isEmptyBlock|getEntities\(|getEntitiesOfClass"
          sig net.minecraft.world.entity.player.Player "getInventory|inventoryMenu|containerMenu|getAttackStrengthScale|isSpectator|isCreative|getAbilities"
          sig net.minecraft.world.item.ItemStack " is\(|getCount|isEmpty|EMPTY"
          sig net.minecraft.world.item.Items "END_CRYSTAL|RESPAWN_ANCHOR|GLOWSTONE;|TOTEM_OF_UNDYING|OBSIDIAN"
          sig net.minecraft.world.level.block.Blocks "OBSIDIAN|BEDROCK|RESPAWN_ANCHOR|GLOWSTONE;"
          sig net.minecraft.world.phys.BlockHitResult
          sig net.minecraft.world.phys.HitResult "getType|getLocation"
          sig net.minecraft.world.item.ItemDisplayContext
          sig net.minecraft.client.KeyMapping "click|saveString|isDown|consumeClick|setDown|getKey|matches"
          sig com.mojang.blaze3d.platform.InputConstants "getKey"
          sig net.minecraft.client.player.LocalPlayer "isShiftKeyDown|isUsingItem|isHandsBusy| connection|swing"
          sig net.minecraft.world.level.block.state.StateHolder "getValue|hasProperty"
          sig net.minecraft.world.level.block.state.BlockBehaviour\$BlockStateBase " is\(|isAir|getBlock\("
          sig net.minecraft.core.BlockPos "above\(|below\(|containing"
          sig net.minecraft.world.phys.AABB "AABB\(|ofSize|inflate"
          sig net.minecraft.client.multiplayer.ClientPacketListener "handleSetHealth|handleRemoveEntities|handleAddEntity|handleDamageEvent|handleBlockUpdate"
          sig net.minecraft.client.gui.Gui "renderItemHotbar|renderHotbar|renderSlot|hotbar"
