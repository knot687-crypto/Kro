name: Build

on:
  push:
    branches: [ 'claude/**', 'main', 'master' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kro-jar
          path: build/libs/*.jar

      # Boots the real game with Kro, opens the menu, the HUD editor and a fight, and screenshots each
      - name: In-game screenshots
        env:
          # software GL: leave CPU for the integrated server
          LP_NUM_THREADS: '2'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/run/clientGameTest/screenshots/

      # Small JPEG copies of key screenshots in the log, for review without downloading artifacts
      - name: Screenshot previews
        if: always()
        run: |
          cd build/run/clientGameTest/screenshots 2>/dev/null || exit 0
          cat > /tmp/Preview.java <<'EOF'
          import javax.imageio.*;
          import javax.imageio.stream.*;
          import java.awt.*;
          import java.awt.image.*;
          import java.io.*;
          public class Preview {
              public static void main(String[] a) throws Exception {
                  BufferedImage src = ImageIO.read(new File(a[0]));
                  int w = 960, h = src.getHeight() * w / src.getWidth();
                  BufferedImage out = new BufferedImage(w, h, BufferedImage.TYPE_INT_RGB);
                  Graphics2D g = out.createGraphics();
                  g.drawImage(src.getScaledInstance(w, h, Image.SCALE_AREA_AVERAGING), 0, 0, null);
                  g.dispose();
                  ImageWriter wr = ImageIO.getImageWritersByFormatName("jpg").next();
                  ImageWriteParam p = wr.getDefaultWriteParam();
                  p.setCompressionMode(ImageWriteParam.MODE_EXPLICIT);
                  p.setCompressionQuality(0.85f);
                  try (ImageOutputStream os = ImageIO.createImageOutputStream(new File(a[1]))) {
                      wr.setOutput(os);
                      wr.write(null, new IIOImage(out, null, null), p);
                  }
              }
          }
          EOF
          for f in *.png; do
            case "$f" in *02-menu*|*04-interface*|*08-target-hud*) ;; *) continue ;; esac
            java /tmp/Preview.java "$f" "/tmp/${f%.png}.jpg" || continue
            echo "=== PREVIEW ${f%.png} BEGIN"
            base64 -w 2000 "/tmp/${f%.png}.jpg"
            echo "=== PREVIEW ${f%.png} END"
          done
