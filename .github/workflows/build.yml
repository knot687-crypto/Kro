name: Build

on:
  push:
    branches: [ 'claude/**', 'main', 'master' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kro-jar
          path: build/libs/*.jar


      # Temporary: print exact 1.21.11 signatures used by new features
      - name: API probe
        if: always()
        continue-on-error: true
        run: |
          set +e
          J=$(find ~/.gradle/caches/fabric-loom -name "minecraft-merged*.jar" 2>/dev/null | grep "loom.mappings" | grep -v -i sources | grep -v intermediary | head -1)
          echo "--- using $J"
          sig() { echo "=== SIG $1"; javap -p -cp "$J" "$1" 2>&1 | grep -E -- "${2:-.}" || true; }
          code() { echo "=== CODE $1 :: $2"; javap -p -c -cp "$J" "$1" 2>&1 | awk -v pat="$2(" 'index($0, pat) && !inm && $0 ~ /^  [a-z]/ {inm=1} inm {print} inm && /^$/ {inm=0}' || true; }
          brief() { code "$1" "$2" | grep -E "^  [a-z]|invoke|ldc|fconst|dconst|getstatic|putfield .*(xBob|xBobO)" || true; }
          sig net.minecraft.client.player.LocalPlayer "Bob|RotLast"
          echo "=== LocalPlayer xBob writes"; javap -p -c -cp "$J" net.minecraft.client.player.LocalPlayer | grep -n -E "^  [a-z].*\(|putfield .*Bob" | grep -B1 "putfield" || true
          sig net.minecraft.world.entity.Entity "RotO|getEyeY|getEyePosition|getBoundingBox|isPickable|isSpectator|isSwimming|isAlive|getVehicle|getPosition\(|getBbWidth"
          sig net.minecraft.world.entity.LivingEntity "isFallFlying|getProjectile|getMainArm|getItemInHand"
          sig net.minecraft.world.entity.player.Player "getProjectile|getMainArm"
          sig net.minecraft.world.entity.HumanoidArm "getOpposite|RIGHT"
          sig net.minecraft.client.renderer.GameRenderer " pick\("
          sig net.minecraft.client.Minecraft "gameRenderer"
          sig net.minecraft.core.particles.ParticleTypes "GUST"
          sig net.minecraft.core.particles.ParticleOptions "getType"
          sig net.minecraft.world.item.component.ChargedProjectiles
          sig net.minecraft.core.component.DataComponents "CHARGED_PROJECTILES"
          sig net.minecraft.world.item.enchantment.EnchantmentHelper "Spin|Trident"
          sig net.minecraft.world.phys.AABB "AABB\(double|inflate\(double\)"
          sig net.minecraft.world.phys.Vec3 "cross|dot|distanceTo\("
          sig net.minecraft.world.level.material.FluidState " is\("
          sig net.minecraft.tags.FluidTags "WATER"
          sig net.minecraft.core.BlockPos "containing"
          sig net.minecraft.core.Direction "getStep"
          brief net.minecraft.world.entity.projectile.ThrowableProjectile tick
          code net.minecraft.world.entity.projectile.ThrowableProjectile getDefaultGravity
          brief net.minecraft.world.entity.projectile.ThrowableProjectile applyInertia
          code net.minecraft.world.entity.projectile.ProjectileUtil computeMargin
          brief net.minecraft.world.entity.projectile.ProjectileUtil getEntityHitResult
          brief net.minecraft.world.entity.projectile.arrow.AbstractArrow tick
          code net.minecraft.world.entity.projectile.arrow.AbstractArrow getDefaultGravity
          code net.minecraft.world.entity.projectile.arrow.AbstractArrow getWaterInertia
          brief net.minecraft.world.entity.projectile.arrow.AbstractArrow findHitEntity
          brief net.minecraft.world.entity.projectile.arrow.AbstractArrow AbstractArrow
          code net.minecraft.world.entity.projectile.arrow.ThrownTrident getWaterInertia
          brief net.minecraft.world.entity.projectile.hurtingprojectile.AbstractHurtingProjectile tick
          brief net.minecraft.world.entity.projectile.hurtingprojectile.AbstractHurtingProjectile getInertia
          brief net.minecraft.world.entity.projectile.hurtingprojectile.windcharge.AbstractWindCharge getInertia
          brief net.minecraft.world.entity.projectile.hurtingprojectile.windcharge.AbstractWindCharge AbstractWindCharge
          for c in $(unzip -l "$J" | awk '{print $4}' | grep -E "projectile/.*(ThrownExperienceBottle|AbstractThrownPotion|ThrowableItemProjectile)\.class$" | sed 's/\.class$//; s#/#.#g'); do brief "$c" getDefaultGravity; brief "$c" "${c##*.}"; done
          for c in SnowballItem EggItem EnderpearlItem ThrowablePotionItem SplashPotionItem LingeringPotionItem ExperienceBottleItem; do brief "net.minecraft.world.item.$c" use; done
          brief net.minecraft.world.item.CrossbowItem shootProjectile
          brief net.minecraft.world.item.CrossbowItem getShootingPower
