name: Build

on:
  push:
    branches: [ 'claude/**', 'main', 'master' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve Fabric versions
        run: |
          echo "== yarn builds for 1.21.11"
          curl -fsSL https://meta.fabricmc.net/v2/versions/yarn/1.21.11 | jq -r '.[].version' | head -10
          echo "== loader"
          curl -fsSL https://meta.fabricmc.net/v2/versions/loader | jq -r '.[] | "\(.version) stable=\(.stable)"' | head -10
          echo "== fabric-api for 1.21.11"
          curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oP '(?<=<version>)[^<]*\+1\.21\.11(?=</version>)' | sort -V | tail -10
          echo "== loom"
          curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -oP '(?<=<version>)1\.1[3-9][^<]*(?=</version>)' | tail -15
          YARN=$(curl -fsSL https://meta.fabricmc.net/v2/versions/yarn/1.21.11 | jq -r '.[0].version')
          LOADER=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          FAPI=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oP '(?<=<version>)[^<]*\+1\.21\.11(?=</version>)' | sort -V | tail -1)
          echo "KRO_VERSION_ARGS=-Pyarn_mappings=$YARN -Ploader_version=$LOADER -Pfabric_api_version=$FAPI" >> "$GITHUB_ENV"
          echo "Using yarn=$YARN loader=$LOADER fabric-api=$FAPI"

      - name: Build
        run: ./gradlew build $KRO_VERSION_ARGS --stacktrace

      - name: Collect mappings
        if: always()
        run: |
          mkdir -p ci-out
          find ~/.gradle/caches/modules-2 -name 'yarn-*-v2.jar' -exec cp {} ci-out/ \; || true
          ls -la ci-out build/libs || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kro-jar
          path: build/libs/*.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mappings
          path: ci-out/

      - name: Client screenshots
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest $KRO_VERSION_ARGS --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/run/clientGameTest/screenshots/
