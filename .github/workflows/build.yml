name: Build

on:
  push:
    branches: [ 'claude/**', 'main', 'master' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kro-jar
          path: build/libs/*.jar

      # Boots the real game with Kro, opens the menu, the HUD editor and a fight, and screenshots each
      - name: In-game screenshots
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: build/run/clientGameTest/screenshots/
