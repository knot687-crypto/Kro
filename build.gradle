plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'kro-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// The Fabric API modules Kro uses are nested inside the jar, so players only need Fabric Loader.
def apiModules = [
		'fabric-api-base',
		'fabric-resource-loader-v1',
		'fabric-lifecycle-events-v1',
		'fabric-rendering-v1',
]

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	apiModules.each {
		include(modImplementation(fabricApi.module(it, project.fabric_api_version)))
	}

	// full Fabric API only for development runs and the visual test harness
	modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modGametestImplementation fabricApi.module('fabric-client-gametest-api-v1', project.fabric_api_version)
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
